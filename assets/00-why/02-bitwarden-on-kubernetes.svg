<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" role="img" aria-labelledby="t2 d2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t2">Bitwarden on OpenShift, at a glance</title>
<desc id="d2">Browsers and apps reach the OpenShift router. Routes send each path to a Bitwarden service: web, api, identity, admin, icons, notifications, events, attachments and sso. The services use a SQL Server pod with its own block storage volume, and shared volumes on Amazon EFS. Purple is provided by OpenShift, teal is deployed by the Bitwarden Helm chart, grey is outside the cluster.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="424" fill="#ffffff"/>

<rect x="240" y="20" width="200" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">Browsers and apps</text>
<line x1="340" y1="60" x2="340" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="180" y="90" width="320" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="106" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">OpenShift router</text>
<text x="340" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Routes send each path to a service</text>
<line x1="340" y1="138" x2="340" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="60" y="170" width="560" height="112" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="80" y="190" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Bitwarden services (Helm chart)</text>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">web · api · identity · admin · icons</text>
<text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">notifications · events · attachments · sso</text>
<text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">one pod each by default, and scim is off</text>

<line x1="195" y1="282" x2="195" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="485" y1="282" x2="485" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="60" y="320" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="195" y="338" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">SQL Server pod</text>
<text x="195" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">one replica, EBS volumes</text>

<rect x="350" y="320" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="485" y="338" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Shared volumes on EFS</text>
<text x="485" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">attachments, keys, licences (+ logs)</text>

<text x="340" y="404" text-anchor="middle" font-size="12" fill="#5F5E5A">Purple: OpenShift. Teal: deployed by the Bitwarden chart. Grey: clients and AWS storage.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
