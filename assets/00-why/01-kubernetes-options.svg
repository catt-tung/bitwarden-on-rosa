<text x="168.5" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">and upgrade it</text>

<rect x="244" y="186" width="137" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="312.5" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Cloud runs it</text>
<text x="312.5" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">you pick a version</text>

<rect x="388" y="186" width="137" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="456.5" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">You install it</text>
<text x="456.5" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">and upgrade it</text>

<rect x="532" y="186" width="137" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="600.5" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Red Hat runs it</text>
<text x="600.5" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">you pick a version</text>

<rect x="100" y="244" width="570" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="385" y="266" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">Linux on every node: kernel plus distribution</text>

<rect x="100" y="298" width="570" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="385" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">VMs in a cloud, or your own hardware</text>

<text x="385" y="370" text-anchor="middle" font-size="12" fill="#5F5E5A">Each column is an alternative, not a layer on top of another. The names are examples.</text>
<text x="385" y="390" text-anchor="middle" font-size="12" fill="#5F5E5A">Teal means you operate it. Purple means someone else does.</text>
