<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t1">Four ways to run Kubernetes, side by side</title>
<desc id="d1">Four alternative setups next to each other. Under Kubernetes you assemble around: self-run, for example with kubeadm or by hand, and managed, for example EKS, GKE or AKS. Under a distribution, which bundles the surrounding pieces: self-run, for example OpenShift, OKD or K3s, and managed, for example ROSA or ARO. They share the same Linux nodes and machines underneath and the same applications on top. They differ in who assembles the add-ons and who runs the control plane. Teal boxes are operated by you, purple boxes by someone else.</desc>
<rect x="0" y="0" width="680" height="412" fill="#ffffff"/>

<text x="240" y="10" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">Kubernetes you assemble around</text>
<text x="528" y="10" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">A distribution (bundled)</text>
<line x1="100" y1="24" x2="381" y2="24" stroke="#888780" stroke-width="1"/>
<line x1="388" y1="24" x2="669" y2="24" stroke="#888780" stroke-width="1"/>

<text x="168.5" y="40" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">Self-run</text>
<text x="312.5" y="40" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">Managed</text>
<text x="456.5" y="40" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">Self-run</text>
<text x="600.5" y="40" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">Managed</text>
<text x="168.5" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">kubeadm, by hand</text>
<text x="312.5" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">EKS, GKE, AKS</text>
<text x="456.5" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">OpenShift, OKD, K3s</text>
<text x="600.5" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">ROSA, ARO</text>

<text x="92" y="96" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">Your apps</text>
<text x="92" y="152" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">Add-ons</text>
<text x="92" y="210" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">Control plane</text>
<text x="92" y="266" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">Node OS</text>
<text x="92" y="320" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">Machines</text>

<rect x="100" y="74" width="570" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="385" y="96" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">Your applications, for example Bitwarden</text>

<rect x="100" y="128" width="137" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="168.5" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">You assemble</text>
<text x="168.5" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ingress, logs, etc.</text>

<rect x="244" y="128" width="137" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="312.5" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">You assemble</text>
<text x="312.5" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">some from the cloud</text>

<rect x="388" y="128" width="137" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="456.5" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Bundled in</text>
<text x="456.5" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">you run them</text>

<rect x="532" y="128" width="137" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="600.5" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Bundled in</text>
<text x="600.5" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Red Hat runs them</text>

<rect x="100" y="186" width="137" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
